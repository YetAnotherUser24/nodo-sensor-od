; PlatformIO - Nodo SENSOR OD (Aqualabo DIGISENS / OPTOD por RS-485 Modbus)
;
; Placa real del banco de la tesis: LilyGO T3 LoRa32 (ESP32-PICO-D4) + HAT SP3485EN.
; Ver AGENTS.md regla 21: el pinout depende de la placa y confundirlos cuelga el ESP32-PICO-D4.
; Es la UNICA placa soportada; la bateria se lee por el divisor ADC (SENSOR_BATTERY_ADC).
;
;   pio run                          -> construye el entorno por defecto (lora32)
;   pio run -t upload                -> flashea por USB
;   pio run -e lora32-ota -t upload  -> flashea por WiFi (od-logger-lora.local)
;   pio run -e virtual -t upload     -> firmware sin sensor fisico (bus simulado)
;
; Todos los entornos usan particiones OTA (invariante 13 del proyecto).

[platformio]
default_envs = lora32

; ---------------------------------------------------------------
; Comun a TODOS los entornos
; ---------------------------------------------------------------
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_ota.csv
lib_extra_dirs = lib
; El bus de sensores se elige por entorno: real (Modbus/ADC) o virtual (sensor_sim).
build_src_filter = +<*> -<sensor_bus_virtual.cpp> -<sensor_sim.cpp>

; ---------------------------------------------------------------
; PLACA REAL: LilyGO T3 LoRa32 (v1.6) + HAT de instrumentacion
; ---------------------------------------------------------------
[env:lora32]
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.12.1
build_flags =
    -DBOARD_LILYGO_LORA32
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DN_LOGGER_DEVICE_NAME=\"od-logger-lora\"
    -DSENSOR_OD
    -DSENSOR_BATTERY_ADC
    -DWIFI_MODULE
    -DWEB_MASTER_MODE
    -DDISABLE_BLE
    -DSD_MODULE

[env:lora32-ota]
extends = env:lora32
upload_protocol = espota
upload_port = od-logger-lora.local
upload_flags =
    --port=3232
    --timeout=60

; ---------------------------------------------------------------
; VIRTUAL: sensor sintetico, sin hardware (pruebas de UI y de flujo).
; Usa el mismo backend real con la misma DEVICE_KEY. La bateria es ADC.
; ---------------------------------------------------------------
[env:virtual]
extends = env:lora32
build_flags =
    -DBOARD_LILYGO_LORA32
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DN_LOGGER_DEVICE_NAME=\"od-logger-lora\"
    -DSENSOR_OD
    -DSENSOR_BATTERY_ADC
    -DWIFI_MODULE
    -DSENSOR_VIRTUAL
    -DDISABLE_ESPNOW
    -DWEB_MASTER_MODE
    -DDISABLE_BLE
    -DSD_MODULE
build_src_filter =
    +<*>
    -<sensor_bus_real.cpp>
    -<modbus_rtu.cpp>

; ---------------------------------------------------------------
; DIAGNOSTICO: sonda del bus RS-485 (pin DE/RE, polaridad, baud y esclavo)
; Uso: pio run -e probe -t upload && pio device monitor
; ---------------------------------------------------------------
[env:probe]
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
build_flags =
    -DBOARD_LILYGO_LORA32
    -DMODBUS_PROBE_TOOL
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
build_src_filter =
    -<*>
    +<modbus_probe.cpp>
    +<modbus_rtu.cpp>

; ---------------------------------------------------------------
; DIAGNOSTICO: escaner del bus I2C (descubre perifericos y anota los conocidos)
; ---------------------------------------------------------------
[env:i2c-scan]
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
build_flags =
    -DBOARD_LILYGO_LORA32
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DI2C_SCANNER
lib_deps =
build_src_filter =
    -<*>
    +<i2c_scanner.cpp>
