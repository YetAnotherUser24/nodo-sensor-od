; PlatformIO Project Configuration File
;
; n-logger multi-sensor platform
; Supports multiple build environments with compile-time feature toggles.
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


; ============================================================
; N-Logger GPRS (base configuration for Natek-GPRS v0.2.0 board)
; ============================================================
[env:n-logger-gprs]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = default

; Upload settings
upload_speed = 921600
upload_protocol = esptool

; Extra library directories (using local libs from lib/ folder)
lib_extra_dirs = lib
lib_deps =
    adafruit/Adafruit SH110X @ ^2.1.11
    adafruit/Adafruit GFX Library @ ^1.12.1

; Partition scheme - Huge APP (3MB No OTA / 1MB SPIFFS) as per installation guide
board_build.partitions = huge_app.csv

; Flash mode and frequency
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; Build flags for Natek-GPRS v0.2.0 hardware
build_flags = 
    -DBOARD_NATEK_GPRS_V02
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DTINY_GSM_MODEM_SIM7600
    -DTINY_GSM_RX_BUFFER=1024
    -DN_LOGGER_DEVICE_NAME=\"n-logger\"
    -DMQTT_CLIENT_ID=\"nLoggerClient\"
    -DGPRS_MODULE
    -DSD_MODULE


; ============================================================
; N-Logger SD (base configuration for Natek-SD v2.0 board)
; ============================================================
[env:n-logger-sd]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = default

; Upload settings
upload_speed = 921600
upload_protocol = esptool

; Flash size / partitions
board_build.partitions = huge_app.csv

; Extra library directories
lib_extra_dirs = lib
lib_deps =
    adafruit/Adafruit SH110X @ ^2.1.11
    adafruit/Adafruit GFX Library @ ^1.12.1

; Build flags for Natek-SD v2.0 hardware
build_flags = 
    -DBOARD_NATEK_SD_V2
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DSD_MODULE


; ============================================================
; Full-feature build: MaxBotix UART + SD + BLE + GPRS + Battery ADC
; ============================================================
[env:n-logger-maxbotix-sd-ble-gprs]
extends = env:n-logger-gprs
build_flags =
    ${env:n-logger-gprs.build_flags}
    -DSENSOR_MAXBOTIX_UART
    -DSENSOR_BATTERY_ADC


; ============================================================
; MaxBotix + SD + BLE (Natek-SD v2.0 board)
; ============================================================
[env:n-logger-maxbotix-sd]
extends = env:n-logger-sd
build_flags =
    ${env:n-logger-sd.build_flags}
    -DSENSOR_MAXBOTIX_UART
    -DSENSOR_INA226
    -DSENSOR_WATER_TEMP


; ============================================================
; Radar (Modbus RTU over direct UART) + SD + BLE + GPRS + Battery ADC
; ============================================================
[env:n-logger-radar-sd-ble-gprs]
extends = env:n-logger-gprs
build_flags =
    ${env:n-logger-gprs.build_flags}
    -DSENSOR_RADAR
    -DSENSOR_BATTERY_ADC

; ============================================================
; Radar (Modbus RTU over direct UART) + SD + BLE + GPRS + Battery ADC
; ============================================================
[env:n-logger-radar-sd-ble-gprs-noswap]
extends = env:n-logger-gprs
build_flags =
    ${env:n-logger-gprs.build_flags}
    -DSENSOR_RADAR
    -DSENSOR_BATTERY_ADC
    -DI2C_EEPROM_SDA_PIN=-1
    -DI2C_EEPROM_SCL_PIN=-1

; ============================================================
; 3-Probe Soil Sensor (Modbus RTU over RS-485) + SD + BLE + GPRS + Battery ADC
; NOTE: Mutually exclusive with radar — they share UART pins and power pin.
; ============================================================
[env:n-logger-soil3tip-sd-ble-gprs]
extends = env:n-logger-gprs
build_flags =
    ${env:n-logger-gprs.build_flags}
    -DSENSOR_SOIL_3TIP
    -DSENSOR_BATTERY_ADC


; ============================================================
; Water Temperature + SD + BLE + GPRS + Battery ADC
; ============================================================
[env:n-logger-watertemp-sd-ble-gprs]
extends = env:n-logger-gprs
build_flags =
    ${env:n-logger-gprs.build_flags}
    -DSENSOR_WATER_TEMP
    -DSENSOR_BATTERY_ADC


; ============================================================
; MLX90614 (IR Surface & Ambient Temp) + SD + BLE + GPRS + INA226
; ============================================================
[env:n-logger-mlx90614-sd-ble-gprs]
extends = env:n-logger-gprs
build_flags =
    ${env:n-logger-gprs.build_flags}
    -DSENSOR_MLX90614
    -DSENSOR_INA226


; ============================================================
; Radar + SD + BLE (Natek-SD v2.0 board)
; ============================================================
[env:n-logger-radar-sd]
extends = env:n-logger-sd
build_flags =
    ${env:n-logger-sd.build_flags}
    -DSENSOR_RADAR


; ============================================================
; Custom Soil-3Tip (Natek-SD v2.0 board)
; ============================================================
[env:custom-soil3tip-sd]
extends = env:n-logger-sd
build_flags =
    ${env:n-logger-sd.build_flags}
    -DSENSOR_SOIL_3TIP


; ============================================================
; Optical Dissolved Oxygen (OD) Digisens + SD + BLE + GPRS + Battery ADC
; ============================================================
[env:n-logger-od-sd-ble-gprs]
extends = env:n-logger-gprs
build_flags =
    ${env:n-logger-gprs.build_flags}
    -DSENSOR_OD
    -DSENSOR_BATTERY_ADC


; ============================================================
; Optical Dissolved Oxygen (OD) Digisens + SD + BLE (Natek-SD v2.0 board)
; ============================================================
[env:n-logger-od-sd]
extends = env:n-logger-sd
build_flags =
    ${env:n-logger-sd.build_flags}
    -DSENSOR_OD


