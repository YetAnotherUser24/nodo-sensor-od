; PlatformIO Project Configuration File
;
; OD-Logger: Aqualabo DIGISENS Optical Dissolved Oxygen (OD) Telemetry System
; Supports Natek-GPRS v0.2.0 (with SIM7670 modem) and Natek-SD v2.0 (with INA226).
;

[platformio]
default_envs = od-logger-gprs

; ============================================================
; Base configuration for Natek-GPRS v0.2.0 board (LilyGO T-A7670SA)
; ============================================================
[env:base-gprs]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = default

; Upload settings
upload_speed = 921600
upload_protocol = esptool

; Extra library directories (using local libs from lib/ folder)
lib_extra_dirs = lib
lib_deps =
    adafruit/Adafruit SH110X @ ^2.1.11
    adafruit/Adafruit GFX Library @ ^1.12.1

; Partition scheme - Huge APP (3MB No OTA / 1MB SPIFFS)
board_build.partitions = huge_app.csv

; Flash mode and frequency
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; Build flags for Natek-GPRS v0.2.0 hardware
build_flags = 
    -DBOARD_NATEK_GPRS_V02
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DN_LOGGER_DEVICE_NAME=\"od-logger\"
    -DN_LOGGER_BLE_NAME=\"od-logger-BLE\"
    -DWIFI_MODULE
    -DSD_MODULE


; ============================================================
; Base configuration for Natek-SD v2.0 board (Bare ESP32-WROOM-32E)
; ============================================================
[env:base-sd]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = default

; Upload settings
upload_speed = 921600
upload_protocol = esptool

; Flash size / partitions
board_build.partitions = huge_app.csv

; Extra library directories
lib_extra_dirs = lib
lib_deps =
    adafruit/Adafruit SH110X @ ^2.1.11
    adafruit/Adafruit GFX Library @ ^1.12.1

; Build flags for Natek-SD v2.0 hardware
build_flags = 
    -DBOARD_NATEK_SD_V2
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DN_LOGGER_DEVICE_NAME=\"od-logger\"
    -DN_LOGGER_BLE_NAME=\"od-logger-BLE\"
    -DSD_MODULE


; ============================================================
; Optical Dissolved Oxygen (OD) + SD + BLE + GPRS + Battery ADC
; Hardware: Natek-GPRS v0.2.0 (LilyGO T-A7670SA base + hat)
; ============================================================
[env:od-logger-gprs]
extends = env:base-gprs
build_flags =
    ${env:base-gprs.build_flags}
    -DSENSOR_OD
    -DSENSOR_BATTERY_ADC

; Backward-compatible alias
[env:n-logger-od-sd-ble-gprs]
extends = env:od-logger-gprs


; ============================================================
; Optical Dissolved Oxygen (OD) + SD + BLE + INA226 Battery Monitor
; Hardware: Natek-SD v2.0 (Bare ESP32-WROOM-32E MCU)
; ============================================================
[env:od-logger-sd]
extends = env:base-sd
build_flags =
    ${env:base-sd.build_flags}
    -DSENSOR_OD
    -DSENSOR_INA226
    -DWIFI_MODULE

; Backward-compatible alias
[env:n-logger-od-sd]
extends = env:od-logger-sd


; ============================================================
; Web Dashboard Master Control Environment
; Hardware: Natek-SD v2.0 (Bare ESP32-WROOM-32E MCU)
; Dedicated to Web Dashboard supervision, live telemetry streaming,
; SD experiment logging, ESP-NOW actuation. Drops BLE and periodic sleep.
; ============================================================
[env:od-logger-web]
extends = env:base-sd
build_flags =
    ${env:base-sd.build_flags}
    -DSENSOR_OD
    -DSENSOR_INA226
    -DWIFI_MODULE
    -DWEB_MASTER_MODE
    -DDISABLE_BLE
    -TEST

; Virtual Web Master environment for bench testing without sensors
[env:od-logger-web-virtual]
extends = env:base-sd
build_flags =
    -DBOARD_NATEK_SD_V2
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DN_LOGGER_DEVICE_NAME=\"od-logger\"
    -DWIFI_MODULE
    -DSENSOR_VIRTUAL
    -DDISABLE_ESPNOW
    -DWEB_MASTER_MODE
    -DDISABLE_BLE


; ============================================================
; Virtual Sensor Environment for Web Dashboard Testing
; Simulates OD readings, disables ESP-NOW, enables WiFi telemetry upload
; Runs autonomously on bare ESP32 without peripherals
; ============================================================
[env:od-logger-virtual]
extends = env:base-sd
build_flags = 
    -DBOARD_NATEK_SD_V2
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DN_LOGGER_DEVICE_NAME=\"od-logger\"
    -DN_LOGGER_BLE_NAME=\"od-logger-BLE\"
    -DWIFI_MODULE
    -DSENSOR_VIRTUAL
    -DDISABLE_ESPNOW

; Virtual Sensor for Natek-SD v2.0 hardware (retaining SD module)
[env:od-logger-virtual-sd]
extends = env:base-sd
build_flags = 
    ${env:base-sd.build_flags}
    -DWIFI_MODULE
    -DSENSOR_VIRTUAL
    -DDISABLE_ESPNOW


; ============================================================
; I2C Bus Diagnostic Scanner
; Standalone diagnostic tool for discovering connected I2C peripherals.
; Automatically energizes I2C power rail and prints peripheral annotations.
; ============================================================
[env:i2c-scanner]
extends = env:base-sd
build_flags =
    -DBOARD_NATEK_SD_V2
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DI2C_SCANNER
lib_deps =
build_src_filter =
    -<*>
    +<i2c_scanner.cpp>

; Backward-compatible / hardware-specific alias
[env:i2c-scanner-sd]
extends = env:i2c-scanner

; I2C Scanner for Natek-GPRS v0.2.0 (LilyGO T-A7670SA base + hat)
[env:i2c-scanner-gprs]
extends = env:base-gprs
build_flags =
    -DBOARD_NATEK_GPRS_V02
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DI2C_SCANNER
lib_deps =
build_src_filter =
    -<*>
    +<i2c_scanner.cpp>

