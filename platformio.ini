; PlatformIO Project Configuration File
;
; n-logger multi-sensor platform
; Supports multiple build environments with compile-time feature toggles.
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


; ============================================================
; N-Logger GPRS (base configuration)
; ============================================================
[env:n-logger-gprs]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = default

; Upload settings
upload_speed = 921600
upload_protocol = esptool

; Library dependencies
; Using local lib/ folder for included libraries
lib_deps = 
    ; Core libraries (if not using local lib/)
    ; bblanchon/ArduinoJson@^7.4.1
    ; knolleary/PubSubClient@^2.8
    ; greiman/SdFat@^2.3.0
    ; makuna/RTC@^2.5.0
    ; mikalhart/TinyGPSPlus@^1.0.3
    ; mobizt/ESP_SSLClient@^2.1.17
    ; 
    ; Note: TinyGSM fork by LewisHe is in lib/ folder
    ; If you want to use library registry instead of local lib/ folder,
    ; uncomment the dependencies above and remove the corresponding
    ; folders from lib/

; Extra library directories (using local libs from lib/ folder)
lib_extra_dirs = lib

; Build options
build_unflags = 

; Partition scheme - Huge APP (3MB No OTA / 1MB SPIFFS) as per installation guide
board_build.partitions = huge_app.csv

; Flash mode and frequency
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; Additional build flags for ESP32 features
build_flags = 
    -DLILYGO_T_A7670
    -DBOARD_BAT_ADC_PIN=35
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DMODEM_BAUDRATE=115200
    -DTINY_GSM_MODEM_SIM7600
    -DTINY_GSM_RX_BUFFER=1024
    -DN_LOGGER_DEVICE_NAME=\"n-logger\"
    -DMQTT_CLIENT_ID=\"nLoggerClient\"
    -DGPRS_MODULE
    -DSD_MODULE
    ; EEPROM I2C pins are swapped on LILYGO T-A7670 PCB traces
    ; Wire1 initializes with (SCL=SDA_PAD, SDA=SCL_PAD) to compensate
    -DI2C_EEPROM_SDA_PIN=22
    -DI2C_EEPROM_SCL_PIN=21

; Optional: specify upload port (uncomment and adjust)
; upload_port = COM3

; Optional: OTA settings for remote updates
; upload_protocol = espota
; upload_port = 192.168.1.x


; ============================================================
; N-Logger SD (base configuration)
; ============================================================
[env:n-logger-sd]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = default

; Upload settings
upload_speed = 921600
upload_protocol = esptool

; --- Flash size detected as 4MB by PlatformIO ---
board_build.partitions = huge_app.csv

; Library dependencies
; Using local lib/ folder for included libraries
lib_deps = 
    ; Core libraries (if not using local lib/)
    ; bblanchon/ArduinoJson@^7.4.1
    ; knolleary/PubSubClient@^2.8
    ; greiman/SdFat@^2.3.0
    ; makuna/RTC@^2.5.0
    ; mikalhart/TinyGPSPlus@^1.0.3
    ; mobizt/ESP_SSLClient@^2.1.17
    ; 
    ; Note: TinyGSM fork by LewisHe is in lib/ folder
    ; If you want to use library registry instead of local lib/ folder,
    ; uncomment the dependencies above and remove the corresponding
    ; folders from lib/

; Extra library directories (using local libs from lib/ folder)
lib_extra_dirs = lib

; Additional build flags for ESP32 features
build_flags = 
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DSD_MODULE

; Optional: specify upload port (uncomment and adjust)
; upload_port = COM3

; Optional: OTA settings for remote updates
; upload_protocol = espota
; upload_port = 192.168.1.x


; ============================================================
; Full-feature build: MaxBotix UART + SD + BLE + GPRS + Battery ADC
; Equivalent to original single-ino build.
; ============================================================
[env:n-logger-maxbotix-sd-ble-gprs]
extends = env:n-logger-gprs
build_flags =
    ${env:n-logger-gprs.build_flags}
    -DSENSOR_MAXBOTIX_UART
    -DSENSOR_BATTERY_ADC


; ============================================================
; MaxBotix + SD + BLE
; ============================================================
[env:n-logger-maxbotix-sd]
extends = env:n-logger-sd
build_flags =
    ${env:n-logger-sd.build_flags}
    -DSENSOR_MAXBOTIX_UART
    -DI2C_SDA_PIN=22
    -DI2C_SCL_PIN=21
    -DMAXBOTIX_RX_PIN=34
    -DMAXBOTIX_TX_PIN=-1
    -DMAXBOTIX_PWR_PIN=27
    -DLED_PIN=32
    -DWAKEUP_PIN=4
    -DSD_PIN_SCLK=18
    -DSD_PIN_MISO=19
    -DSD_PIN_MOSI=23
    -DSD_PIN_CS=5
    -DSD_EN_PIN=15
    -DSENSOR_INA226


; ============================================================
; Radar (Modbus RTU over direct UART) + SD + BLE + GPRS + Battery ADC
; ============================================================
[env:n-logger-radar-sd-ble-gprs]
extends = env:n-logger-gprs
build_flags =
    ${env:n-logger-gprs.build_flags}
    -DSENSOR_RADAR
    -DSENSOR_BATTERY_ADC


; ============================================================
; 3-Probe Soil Sensor (Modbus RTU over RS-485) + SD + BLE + GPRS + Battery ADC
; NOTE: Mutually exclusive with radar — they share UART pins and power pin.
; ============================================================
[env:n-logger-soil3tip-sd-ble-gprs]
extends = env:n-logger-gprs
build_flags =
    ${env:n-logger-gprs.build_flags}
    -DSENSOR_SOIL_3TIP
    -DSENSOR_BATTERY_ADC
    -DSOIL_EN_PIN=18
    -DSOIL_EN_ACTIVE_HIGH=true


; ============================================================
; Water Temperature + SD + BLE + GPRS + Battery ADC
; ============================================================
[env:n-logger-watertemp-sd-ble-gprs]
extends = env:n-logger-gprs
build_flags =
    ${env:n-logger-gprs.build_flags}
    -DSENSOR_WATER_TEMP
    -DSENSOR_BATTERY_ADC


; ============================================================
; Radar + SD + BLE
; ============================================================
[env:n-logger-radar-sd]
extends = env:n-logger-sd
build_flags =
    ${env:n-logger-sd.build_flags}
    -DSENSOR_RADAR


; ============================================================
; Custom Soil-3Tip (SD only)
; RX=16, TX=17, PWR=25(ACTIVE HIGH), EN=26(ACTIVE LOW), DE/RE=2
; ============================================================
[env:custom-soil3tip-sd]
extends = env:n-logger-sd
build_flags =
    ${env:n-logger-sd.build_flags}
    -DSENSOR_SOIL_3TIP
    -DSOIL_RX_PIN=16
    -DSOIL_TX_PIN=17
    -DSOIL_PWR_PIN=25
    -DSOIL_DE_RE_PIN=2
    -DSOIL_EN_PIN=26
    -DSOIL_EN_ACTIVE_HIGH=false
    -DI2C_SDA_PIN=22
    -DI2C_SCL_PIN=21


; ============================================================
; Diagnostic: minimal Serial + deep sleep (no sensors, no I2C)
; Use to test if wake/sleep cycle works on this hardware
; ============================================================
[env:diag-minimal]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool
src_dir = src_diag
build_flags = -DDEBUG
