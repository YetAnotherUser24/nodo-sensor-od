; PlatformIO Project Configuration File
;
; OD-Logger: Aqualabo DIGISENS Optical Dissolved Oxygen (OD) Telemetry System
; Supports Natek-GPRS v0.2.0 (with SIM7670 modem) and Natek-SD v2.0 (with INA226).
;

[platformio]
default_envs = od-logger-web


; ============================================================
; Base configuration for Natek-SD v2.0 board (Bare ESP32-WROOM-32E)
; ============================================================
[env:base-sd]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = default

; Upload settings
upload_speed = 921600
upload_protocol = esptool

; Flash size / partitions
board_build.partitions = huge_app.csv

; Extra library directories
lib_extra_dirs = lib
lib_deps =
    adafruit/Adafruit SH110X @ ^2.1.11
    adafruit/Adafruit GFX Library @ ^1.12.1

; Build flags for Natek-SD v2.0 hardware
build_flags = 
    -DBOARD_NATEK_SD_V2
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DN_LOGGER_DEVICE_NAME=\"od-logger\"
    -DN_LOGGER_BLE_NAME=\"od-logger-BLE\"
    -DSD_MODULE




; ============================================================
; Optical Dissolved Oxygen (OD) + SD + BLE + INA226 Battery Monitor
; Hardware: Natek-SD v2.0 (Bare ESP32-WROOM-32E MCU)
; ============================================================
[env:od-logger-sd]
extends = env:base-sd
build_flags =
    ${env:base-sd.build_flags}
    -DSENSOR_OD
    -DSENSOR_INA226
    -DWIFI_MODULE

; Backward-compatible alias
[env:n-logger-od-sd]
extends = env:od-logger-sd


; ============================================================
; Web Dashboard Master Control Environment
; Hardware: Natek-SD v2.0 (Bare ESP32-WROOM-32E MCU)
; Dedicated to Web Dashboard supervision, live telemetry streaming,
; SD experiment logging, ESP-NOW actuation. Drops BLE and periodic sleep.
; ============================================================
[env:od-logger-web]
extends = env:base-sd
build_flags =
    ${env:base-sd.build_flags}
    -DSENSOR_OD
    -DSENSOR_INA226
    -DWIFI_MODULE
    -DWEB_MASTER_MODE
    -DDISABLE_BLE

; OTA environment for Web Dashboard Master
[env:od-logger-web-ota]
extends = env:od-logger-web
upload_protocol = espota
upload_port = od-logger.local
upload_flags =
    --port=3232
    --timeout=60

; Virtual Web Master environment for bench testing without sensors
[env:od-logger-web-virtual]
extends = env:base-sd
build_flags =
    -DBOARD_NATEK_SD_V2
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DN_LOGGER_DEVICE_NAME=\"od-logger\"
    -DWIFI_MODULE
    -DSENSOR_VIRTUAL
    -DDISABLE_ESPNOW
    -DWEB_MASTER_MODE
    -DDISABLE_BLE


; ============================================================
; Virtual Sensor Environment for Web Dashboard Testing
; Simulates OD readings, disables ESP-NOW, enables WiFi telemetry upload
; Runs autonomously on bare ESP32 without peripherals
; ============================================================
[env:od-logger-virtual]
extends = env:base-sd
build_flags = 
    -DBOARD_NATEK_SD_V2
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DN_LOGGER_DEVICE_NAME=\"od-logger\"
    -DN_LOGGER_BLE_NAME=\"od-logger-BLE\"
    -DWIFI_MODULE
    -DSENSOR_VIRTUAL
    -DDISABLE_ESPNOW

; Virtual Sensor for Natek-SD v2.0 hardware (retaining SD module)
[env:od-logger-virtual-sd]
extends = env:base-sd
build_flags = 
    ${env:base-sd.build_flags}
    -DWIFI_MODULE
    -DSENSOR_VIRTUAL
    -DDISABLE_ESPNOW


; ============================================================
; I2C Bus Diagnostic Scanner
; Standalone diagnostic tool for discovering connected I2C peripherals.
; Automatically energizes I2C power rail and prints peripheral annotations.
; ============================================================
[env:i2c-scanner]
extends = env:base-sd
build_flags =
    -DBOARD_NATEK_SD_V2
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DI2C_SCANNER
lib_deps =
build_src_filter =
    -<*>
    +<i2c_scanner.cpp>

; Backward-compatible / hardware-specific alias
[env:i2c-scanner-sd]
extends = env:i2c-scanner


; ============================================================
; LilyGO T3 LoRa32 (v1.6) + Custom Instrumentation HAT
; ============================================================
[env:od-logger-lora32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
lib_extra_dirs = lib
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.12.1
build_flags =
    -DBOARD_LILYGO_LORA32
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DN_LOGGER_DEVICE_NAME=\"od-logger-lora\"
    -DSENSOR_OD
    -DSENSOR_BATTERY_ADC
    -DWIFI_MODULE
    -DWEB_MASTER_MODE
    -DDISABLE_BLE
    -DSD_MODULE

