; PlatformIO Project Configuration File
;
; n-logger multi-sensor platform
; Supports multiple build environments with compile-time feature toggles.
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


; ============================================================
; N-Logger GPRS (base configuration)
; ============================================================
[env:n-logger-gprs]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = default

; Upload settings
upload_speed = 921600
upload_protocol = esptool

; Library dependencies
; Using local lib/ folder for included libraries
lib_deps = 
    ; Core libraries (if not using local lib/)
    ; bblanchon/ArduinoJson@^7.4.1
    ; knolleary/PubSubClient@^2.8
    ; greiman/SdFat@^2.3.0
    ; makuna/RTC@^2.5.0
    ; mikalhart/TinyGPSPlus@^1.0.3
    ; mobizt/ESP_SSLClient@^2.1.17
    ; 
    ; Note: TinyGSM fork by LewisHe is in lib/ folder
    ; If you want to use library registry instead of local lib/ folder,
    ; uncomment the dependencies above and remove the corresponding
    ; folders from lib/

; Extra library directories (using local libs from lib/ folder)
lib_extra_dirs = lib

; Build options
build_unflags = 

; Partition scheme - Huge APP (3MB No OTA / 1MB SPIFFS) as per installation guide
board_build.partitions = huge_app.csv

; Flash mode and frequency
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; Additional build flags for ESP32 features
build_flags = 
    -DLILYGO_T_A7670
    -DBOARD_BAT_ADC_PIN=35
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DMODEM_BAUDRATE=115200
    -DTINY_GSM_MODEM_SIM7600
    -DTINY_GSM_RX_BUFFER=1024
    -DN_LOGGER_DEVICE_NAME=\"n-logger\"
    -DMQTT_CLIENT_ID=\"nLoggerClient\"
    -DGPRS_MODULE
    -DSD_MODULE

; Optional: specify upload port (uncomment and adjust)
; upload_port = COM3

; Optional: OTA settings for remote updates
; upload_protocol = espota
; upload_port = 192.168.1.x


; ============================================================
; N-Logger SD (base configuration)
; ============================================================
[env:n-logger-sd]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = default

; Upload settings
upload_speed = 921600
upload_protocol = esptool

; --- Definir la memoria Flash de 8MB ---
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

; Library dependencies
; Using local lib/ folder for included libraries
lib_deps = 
    ; Core libraries (if not using local lib/)
    ; bblanchon/ArduinoJson@^7.4.1
    ; knolleary/PubSubClient@^2.8
    ; greiman/SdFat@^2.3.0
    ; makuna/RTC@^2.5.0
    ; mikalhart/TinyGPSPlus@^1.0.3
    ; mobizt/ESP_SSLClient@^2.1.17
    ; 
    ; Note: TinyGSM fork by LewisHe is in lib/ folder
    ; If you want to use library registry instead of local lib/ folder,
    ; uncomment the dependencies above and remove the corresponding
    ; folders from lib/

; Extra library directories (using local libs from lib/ folder)
lib_extra_dirs = lib

; Additional build flags for ESP32 features
build_flags = 
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DSD_MODULE

; Optional: specify upload port (uncomment and adjust)
; upload_port = COM3

; Optional: OTA settings for remote updates
; upload_protocol = espota
; upload_port = 192.168.1.x


; ============================================================
; Full-feature build: MaxBotix UART + SD + BLE + GPRS + Battery ADC
; Equivalent to original single-ino build.
; ============================================================
[env:n-logger-maxbotix-sd-ble-gprs]
extends = env:n-logger-gprs
build_flags =
    -DSENSOR_MAXBOTIX_UART
    -DSENSOR_BATTERY_ADC


; ============================================================
; Radar (Modbus RTU over direct UART) + SD + BLE + GPRS + Battery ADC
; ============================================================
[env:n-logger-radar-sd-ble-gprs]
extends = env:n-logger-gprs
build_flags =
    -DSENSOR_RADAR
    -DSENSOR_BATTERY_ADC


; ============================================================
; 3-Tip Soil Sensor (Modbus RTU over RS-485) + SD + BLE + GPRS + Battery ADC
; NOTE: Mutually exclusive with radar — they share UART pins and power pin.
; ============================================================
[env:n-logger-soil3tip-sd-ble-gprs]
extends = env:n-logger-gprs
build_flags =
    -DSENSOR_SOIL_3TIP
    -DSENSOR_BATTERY_ADC


; ============================================================
; Water Temperature + SD + BLE + GPRS + Battery ADC
; ============================================================
[env:n-logger-watertemp-sd-ble-gprs]
extends = env:n-logger-gprs
build_flags =
    -DSENSOR_WATER_TEMP
    -DSENSOR_BATTERY_ADC


; ============================================================
; MaxBotix + SD + BLE
; ============================================================
[env:n-logger-maxbotix-sd]
extends = env:n-logger-sd
build_flags =
    -DSENSOR_MAXBOTIX_UART


; ============================================================
; Radar + SD + BLE
; ============================================================
[env:n-logger-radar-sd]
extends = env:n-logger-sd
build_flags =
    -DSENSOR_RADAR