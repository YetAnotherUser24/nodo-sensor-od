; PlatformIO Project Configuration File
;
; n-logger multi-sensor platform
; Supports multiple build environments with compile-time feature toggles.
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
lib_extra_dirs = lib

; Common build flags shared across all environments
build_flags_common =
    -DCORE_DEBUG_LEVEL=0
    -DN_LOGGER_DEVICE_NAME=\"n-logger\"
    -DMQTT_CLIENT_ID=\"nLoggerClient\"

; ============================================================
; Full-feature build: MaxBotix UART + SD + BLE + GPRS + Battery ADC
; Equivalent to original single-ino build.
; ============================================================
[env:n-logger-maxbotix-sd-ble-gprs]
board = esp32dev
build_flags =
    ${common.build_flags_common}
    -DLILYGO_T_A7670
    -DDEBUG
    -DMODEM_BAUDRATE=115200
    -DTINY_GSM_MODEM_SIM7600
    -DTINY_GSM_RX_BUFFER=1024
    -DSENSOR_MAXBOTIX_UART
    -DSENSOR_BATTERY_ADC
    -DSD_MODULE
    -DGPRS_MODULE

; ============================================================
; MaxBotix UART + SD + BLE (no GPRS/modem)
; ============================================================
[env:n-logger-maxbotix-sd-ble]
board = esp32dev
build_flags =
    ${common.build_flags_common}
    -DLILYGO_T_A7670
    -DDEBUG
    -DSENSOR_MAXBOTIX_UART
    -DSENSOR_BATTERY_ADC
    -DSD_MODULE

; ============================================================
; MaxBotix UART + BLE + GPRS (no SD card)
; ============================================================
[env:n-logger-maxbotix-ble-gprs]
board = esp32dev
build_flags =
    ${common.build_flags_common}
    -DLILYGO_T_A7670
    -DDEBUG
    -DMODEM_BAUDRATE=115200
    -DTINY_GSM_MODEM_SIM7600
    -DTINY_GSM_RX_BUFFER=1024
    -DSENSOR_MAXBOTIX_UART
    -DSENSOR_BATTERY_ADC
    -DGPRS_MODULE

; ============================================================
; Water Temperature + SD + BLE + GPRS (placeholder)
; ============================================================
[env:n-logger-watertemp-sd-ble-gprs]
